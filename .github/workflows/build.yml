name: Construire le depot PaperStream
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Tests
        working-directory: src
        run: go test ./...
      - name: Programme Windows et paquet d'installation
        run: |
          set -euo pipefail
          mkdir -p dist/mulcv-paperstream
          (cd src && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/mulcv-paperstream/mulcv-depot.exe .)
          cp -r install.ps1 postes README.md dist/mulcv-paperstream/
          (cd dist && zip -qr mulcv-paperstream.zip mulcv-paperstream)
      - uses: actions/upload-artifact@v4
        with:
          name: mulcv-paperstream
          path: dist/mulcv-paperstream.zip
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mulcv-paperstream.zip --title "$GITHUB_REF_NAME" --notes "Paquet d'installation des postes de numérisation."
